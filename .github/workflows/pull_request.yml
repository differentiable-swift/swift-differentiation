name: Pull Request

on: [pull_request]

jobs:
  Lint:
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v4
      - name: SwiftFormat
        run: swiftformat --lint --strict . --reporter github-actions-log
  test-ubuntu-latest:
    name: Test Swift ${{ matrix.swift }} Ubuntu Latest
    strategy:
      matrix:
        swift: ["6.3", "6.4"]
    runs-on: ubuntu-latest
    container: swift:${{ matrix.swift }}
    steps:
      - uses: actions/checkout@v4
      - name: Run Tests
        run: swift test -Xswiftc -warnings-as-errors
        
  build-benchmarks-ubuntu-latest:
    name: Build Benchmarks ${{ matrix.swift }} Ubuntu Latest
    strategy:
      matrix:
        swift: ["6.3", "6.4"]
    runs-on: ubuntu-latest
    container: swift:${{ matrix.swift }}
    steps:
      - uses: actions/checkout@v4
      - name: Build Benchmarks
        run: apt-get update && apt-get install -y libjemalloc-dev && swift build -c release --package-path Benchmarks

  test-macos-26:
    name: Test Swift macos-26
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v4
      - name: Run Tests
        run: |
          swift test -Xswiftc -warnings-as-errors
          
  build-benchmarks-macos-26:
    name: Build Benchmarks macos-26
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v4
      - name: Build Benchmarks
        run: swift build -c release --package-path Benchmarks

  test-wasm:
    name: WASM compilation check
    uses: swiftlang/github-workflows/.github/workflows/swift_package_test.yml@0.0.15
    with:
      enable_linux_checks: false
      enable_windows_checks: false
      enable_wasm_sdk_build: true
      wasm_sdk_versions: "[\"6.3\", \"6.4\"]"

  # 6.5-dev lives on the `main` snapshot stream: there is no nightly-6.5 release
  # branch yet. These jobs are advisory (continue-on-error) so snapshot churn
  # never blocks a PR, and they skip -warnings-as-errors so a red mark means a
  # real failure rather than a new upstream warning.
  test-main-snapshot-ubuntu-latest:
    name: Test Swift 6.5-dev (main snapshot) Ubuntu Latest
    runs-on: ubuntu-latest
    continue-on-error: true
    container: swiftlang/swift:nightly-main-noble
    steps:
      - uses: actions/checkout@v4
      - name: Toolchain version
        run: swift --version
      - name: Run Tests
        run: swift test

  build-benchmarks-main-snapshot-ubuntu-latest:
    name: Build Benchmarks Swift 6.5-dev (main snapshot) Ubuntu Latest
    runs-on: ubuntu-latest
    continue-on-error: true
    container: swiftlang/swift:nightly-main-noble
    steps:
      - uses: actions/checkout@v4
      - name: Toolchain version
        run: swift --version
      - name: Build Benchmarks
        run: apt-get update && apt-get install -y libjemalloc-dev && swift build -c release --package-path Benchmarks

  test-wasm-main-snapshot:
    name: WASM compilation check Swift 6.5-dev (main snapshot)
    runs-on: ubuntu-latest
    continue-on-error: true
    container: swiftlang/swift:nightly-main-noble
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: swiftlang/github-workflows
          ref: 0.0.15
          path: github-workflows
      - name: Toolchain version
        run: swift --version
      - name: Install Swift SDK for Wasm and build
        run: github-workflows/.github/workflows/scripts/install-and-build-with-sdk.sh --wasm nightly-main

  test-main-snapshot-macos-26:
    name: Test Swift 6.5-dev (main snapshot) macos-26
    runs-on: macos-26
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - name: Install swiftly + main snapshot
        run: |
          curl -O https://download.swift.org/swiftly/darwin/swiftly.pkg
          installer -pkg swiftly.pkg -target CurrentUserHomeDirectory
          ~/.swiftly/bin/swiftly init --quiet-shell-followup --assume-yes --skip-install
          # .swift-version is gitignored, so pin the stream explicitly here
          # rather than letting swiftly fall back to the Xcode toolchain.
          ~/.swiftly/bin/swiftly install main-snapshot --use --assume-yes
          echo "$HOME/.swiftly/bin" >> "$GITHUB_PATH"
      - name: Toolchain version
        run: swift --version
      - name: Run Tests
        run: swift test
